<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hệ thống Quản lý Thiết bị</title>
  <style>
    /* CSS Architecture: Mobile-first approach */
    body { font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; background-color: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
    .container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
    
    /* Header Component Styling */
    .form-header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #0056b3; padding-bottom: 15px; }
    .main-title { font-size: 24px; color: #000; margin: 0 0 10px 0; line-height: 1.4; }
    .sub-title { font-size: 18px; color: #555; margin: 0; text-transform: uppercase; }
    
    /* Form Elements Styling */
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; font-size: 14px; }
   input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; outline: none; transition: border-color 0.3s; background-color: #fff; }
    input:focus, select:focus { border-color: #0056b3; }
    button { width: 100%; padding: 14px; background-color: #0056b3; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background-color 0.3s; }
    button:hover { background-color: #004494; }
    
    /* UI States (Loading/Success) */
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid #0056b3; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; display: none;}
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #message { text-align: center; display: none; font-size: 16px; color: #28a745; margin-top: 20px;}
  </style>
</head>
<body>
  <div class="container">
    <!-- Phân hệ Tiêu đề -->
    <div class="form-header">
      <h1 class="main-title">TRUNG TÂM VẬN HÀNH<br>BĐT HÀ TĨNH</h1>
      <h2 class="sub-title">Khai báo thiết bị</h2>
    </div>
    
    <!-- Phân hệ Form Nhập liệu (Đã bỏ trường Dingdong) -->
    <form id="deviceForm">
      <div class="form-group">
        <label for="fullName">Họ và tên:</label>
        <input type="text" id="fullName" required>
      </div>
      <div class="form-group">
        <label for="phone">Số điện thoại:</label>
        <input type="tel" id="phone" required pattern="[0-9]{10,11}">
      </div>
      <div class="form-group">
        <label for="postmanCode">Mã bưu tá:</label>
        <select id="postmanCode" required>
          <!-- Tùy chọn mặc định bắt buộc người dùng phải click chọn -->
          <option value="" disabled selected>-- Vui lòng chọn chức danh --</option>
          
          <!-- Danh sách mã bưu tá (value là dữ liệu sẽ lưu vào Google Sheets) -->
          <option value="CD-001">Bưu tá</option>
          <option value="CD-002">Lái xe </option>
          <option value="CD-015">NV Nghiệp vụ</option>
          <option value="CD-089">NV Khai thác</option>
          
          <!-- Bạn có thể copy dòng option trên và paste thêm bao nhiêu tùy ý -->
        </select>
      </div>
      <button type="submit" id="submitBtn">Gửi thông tin</button>
    </form>
    
    <!-- Phân hệ Phản hồi giao diện -->
    <div class="loader" id="spinner"></div>
    <div id="message"></div>
  </div>

  <script>
    /**
     * CONFIGURATION
     */
    const API_URL = 'https://script.google.com/macros/s/AKfycbyfTel3lLkOaN3mohTjehjupuV2FYRXDeltNWMb2TiimbqrPCSn4SONFrD_ysHcPxs6/exec'; 

    /**
     * MODULE: Trích xuất Hệ điều hành
     */
    function detectOS() {
      var ua = window.navigator.userAgent;
      if (/android/i.test(ua)) {
          var match = ua.match(/Android\s([0-9\.]*)/);
          return match ? "Android " + match[1] : "Android";
      }
      if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
          var match = ua.match(/OS (\d+)_(\d+)_?(\d+)?/);
          return match ? "iOS " + match[1] + "." + match[2] : "iOS";
      }
      return "Unknown OS";
    }

    /**
     * HELPER: Ánh xạ mã Model sang Thương hiệu tương ứng
     */
    function guessBrandFromModel(model) {
        let m = model.toUpperCase();
        if (m.includes('SM-') || m.includes('SAMSUNG') || m.includes('GT-')) return "Samsung";
        if (m.includes('CPH') || m.includes('OPPO') || m.includes('PDK')) return "Oppo";
        if (m.includes('RMX') || m.includes('REALME')) return "Realme";
        if (m.includes('REDMI') || m.includes('MI ') || m.includes('POCO') || /^2[123]/.test(m)) return "Xiaomi";
        if (/^V\d{4}/.test(m) || m.includes('VIVO')) return "Vivo";
        if (m.includes('PIXEL')) return "Google";
        return "Android Device";
    }

    /**
     * MODULE: Trích xuất Thông tin Phần cứng (Asynchronous Client Hints + Regex Fallback)
     */
    async function getDeviceHardware() {
      let brand = "Unknown";
      let model = "Unknown";
      const ua = window.navigator.userAgent;

      // Xử lý Apple (Không đổi vì Apple bị khóa Client Hints)
      if (/iPhone/i.test(ua)) return { brand: "Apple", model: "iPhone" };
      if (/iPad/i.test(ua)) return { brand: "Apple", model: "iPad" };

      // Xử lý Android: Lớp 1 - Sử dụng Client Hints API (Trình duyệt hiện đại)
      if (navigator.userAgentData) {
          try {
              const hints = await navigator.userAgentData.getHighEntropyValues(['model']);
              if (hints.model) {
                  model = hints.model;
                  brand = guessBrandFromModel(model);
                  return { brand: brand, model: model };
              }
          } catch (e) {
              console.warn("Client Hints API bị từ chối truy cập.");
          }
      }

      // Xử lý Android: Lớp 2 - Fallback Regex linh hoạt hơn
      if (/Android/i.test(ua)) {
          // Bắt mọi ký tự nằm giữa 'Android [version];' và 'Build' hoặc dấu ngoặc đóng ')'
          let match = ua.match(/Android[^;]+;\s*([^;]+?)(?:\s*Build\/|\))/i);
          if (match) {
              model = match[1].trim();
              // Loại trừ các giá trị rác như "wv" (WebView) hoặc ngôn ngữ (vi-VN)
              if (model === "wv" || model === "K" || model.length < 3) {
                  model = "Unknown Model";
              } else {
                  brand = guessBrandFromModel(model);
              }
          } else {
              brand = "Android Device";
          }
      }

      return { brand: brand, model: model };
    }

    /**
     * CONTROLLER: Xử lý sự kiện Submit (Chuyển sang Async/Await)
     */
    document.getElementById('deviceForm').addEventListener('submit', async function(e) {
      e.preventDefault(); 
      
      // Khóa UI & Hiển thị Loading
      document.getElementById('submitBtn').style.display = 'none';
      document.getElementById('spinner').style.display = 'block';

      try {
          var formData = new FormData();
          formData.append('fullName', document.getElementById('fullName').value);
          formData.append('phone', document.getElementById('phone').value);
          formData.append('postmanCode', document.getElementById('postmanCode').value);
          
          formData.append('osName', detectOS());
          formData.append('userAgent', window.navigator.userAgent);
          
          // Chờ lấy thông tin phần cứng (Bắt buộc dùng await vì hàm getDeviceHardware đã là async)
          var hardwareInfo = await getDeviceHardware();
          formData.append('deviceBrand', hardwareInfo.brand);
          formData.append('deviceModel', hardwareInfo.model);

          // Gửi API
          const response = await fetch(API_URL, { method: 'POST', body: formData });
          const data = await response.json();

          if (data.result === "success") {
              document.getElementById('spinner').style.display = 'none';
              document.getElementById('deviceForm').style.display = 'none';
              document.getElementById('message').innerHTML = "✅<br><br>Cập nhật thông tin thiết bị thành công!";
              document.getElementById('message').style.display = 'block';
          } else {
              throw new Error("Backend báo lỗi");
          }
      } catch (error) {
          document.getElementById('spinner').style.display = 'none';
          document.getElementById('submitBtn').style.display = 'block';
          alert("Lỗi kết nối API! Vui lòng kiểm tra lại mạng.");
          console.error('System Log:', error);
      }
    });
  </script>
</body>
</html>
